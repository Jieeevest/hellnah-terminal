server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Replikasi proxy dev server Vite (lihat vite.config.ts) buat production — dipakai
    # News/LunarCrush/CoinGlass panel biar nggak kena CORS fetch langsung dari browser.
    location = /dev-proxy/coindesk-rss {
        # Tanpa trailing slash — coindesk 308-redirect /rss/ -> /rss (relatif ke origin kita,
        # bukan ke coindesk.com, jadi browser malah 404 kalau proxy_pass pakai trailing slash).
        proxy_pass https://www.coindesk.com/arc/outboundfeeds/rss;
        proxy_set_header Host www.coindesk.com;
        proxy_ssl_server_name on;
    }
    location = /dev-proxy/cointelegraph-rss {
        proxy_pass https://cointelegraph.com/rss;
        proxy_set_header Host cointelegraph.com;
        proxy_ssl_server_name on;
    }
    location /dev-proxy/lunarcrush/ {
        proxy_pass https://lunarcrush.com/api4/;
        proxy_set_header Host lunarcrush.com;
        proxy_ssl_server_name on;
    }
    location /dev-proxy/coinglass/ {
        proxy_pass https://open-api.coinglass.com/public/v2/;
        proxy_set_header Host open-api.coinglass.com;
        proxy_ssl_server_name on;
    }

    # Proxy internal ke backend trading — "trading-server" resolve lewat Docker network
    # compose, backend sendiri TIDAK publish port ke host (lihat docker-compose.yml).
    location /api-trading/ {
        proxy_pass http://trading-server:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
